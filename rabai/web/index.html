<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>RabAI</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/hljs/highlight.min.js" defer></script>
<script src="vendor/katex/katex.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#composer-input">Skip to message box</a>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Chats"></aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main" id="main">
    <header class="topbar" id="topbar"></header>
    <div class="content" id="content">
      <div class="thread" id="thread" role="log" aria-label="Conversation"></div>
    </div>
    <div class="dock" id="dock"></div>
  </main>
</div>
<noscript>RabAI needs JavaScript to run.</noscript>
</body>
</html>
