name: Import Local IPA Signer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-local-ipa-signer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: local-ipa-signer
          fetch-depth: 0

      - name: Import MIT-licensed browser signer
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/AntonP29/SylvaSigner.git "$tmp/upstream"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmp/upstream/." .
          rm -rf .git
          rm -rf .github/workflows/import-sylva.yml

      - name: Commit target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import SylvaSigner MIT source as Local IPA Signer base"
          git push origin HEAD:local-ipa-signer

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git rm .github/workflows/import-local-ipa-signer.yml
          git commit -m "Remove temporary Local IPA Signer importer"
          git push origin main
