name: Validate Local IPA Signer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-local-ipa-signer.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out signer branch
        uses: actions/checkout@v4
        with:
          ref: local-ipa-signer
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: License check
        run: npm run licenses:check

      - name: Production build
        run: npm run build

      - name: Package source
        run: |
          git archive --format=zip --output=local-ipa-signer-source.zip HEAD
          cd dist
          zip -r ../local-ipa-signer-dist.zip .
          cd ..

      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: local-ipa-signer-tested
          path: |
            local-ipa-signer-source.zip
            local-ipa-signer-dist.zip
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary validator from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          if [ -f .github/workflows/validate-local-ipa-signer.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/validate-local-ipa-signer.yml
            git commit -m "Remove temporary Local IPA Signer validator"
            git push origin main
          fi
